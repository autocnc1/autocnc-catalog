<meta name="description" content="일반 코일매트 · 고밀도 디자인 코일매트 · 엠보싱 카매트 — 오토씨앤씨 카매트 컬렉션">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif;
    --ink:#1D1D1F;
    --muted:#6E6E73;
    --paper:#FBFBFD;
    --surface:#FFFFFF;
    --surface-2:#F5F5F7;
    --line:#D2D2D7;
    --accent:#0070E0;
    --accent-hover:#0077ED;
    --accent-ink:#FFFFFF;
    --accent-soft:#E8F1FD;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 24px 48px -16px rgba(0,0,0,0.14);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --topbar-bg: rgba(251,251,253,0.75);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F5F5F7;
      --muted:#98989D;
      --paper:#000000;
      --surface:#1C1C1E;
      --surface-2:#161617;
      --line:#38383A;
      --accent:#2A96FF;
      --accent-hover:#5CB1FF;
      --accent-ink:#00142B;
      --accent-soft:rgba(42,150,255,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 24px 48px -16px rgba(0,0,0,0.6);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
      --topbar-bg: rgba(0,0,0,0.72);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F5F5F7;
    --muted:#98989D;
    --paper:#000000;
    --surface:#1C1C1E;
    --surface-2:#161617;
    --line:#38383A;
    --accent:#2A96FF;
    --accent-hover:#5CB1FF;
    --accent-ink:#00142B;
    --accent-soft:rgba(42,150,255,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 24px 48px -16px rgba(0,0,0,0.6);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
    --topbar-bg: rgba(0,0,0,0.72);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    padding-inline:24px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  .shell{max-width:1120px; margin:0 auto;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding-block:16px;
    background:var(--topbar-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
    margin-inline:-24px; padding-inline:24px;
    gap:12px; flex-wrap:wrap;
  }
  .topbar-left{display:flex; align-items:center; gap:22px;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .wordmark{
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  .wordmark span{color:var(--accent);}
  .topnav{display:flex; align-items:center; gap:18px;}
  .topnav a{
    font-size:14px; font-weight:600; color:var(--muted);
    padding-block:4px; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .topnav a:hover{color:var(--ink);}
  .topnav a.active{color:var(--ink); border-bottom-color:var(--accent);}
  .topbar-tag{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--muted);
    background:var(--surface-2);
    padding:6px 12px;
    border-radius:980px;
  }

  /* ---------- kakao channel button ---------- */
  .kakao-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:#FEE500; color:#191919;
    font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:980px;
    transition:filter .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .kakao-btn:hover{filter:brightness(0.95); transform:translateY(-1px);}
  .kakao-btn svg{width:15px; height:15px; flex:0 0 auto; display:block;}
  footer .footer-cta{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    gap:14px;
    padding:20px 24px;
    background:var(--surface-2);
    border-radius:18px;
    margin-bottom:20px;
    color:var(--ink);
    font-size:14px; font-weight:500;
  }

  /* ---------- crumb ---------- */
  .crumb{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    font-size:13px;
    color:var(--muted);
    padding-top:20px;
  }
  .crumb a{color:var(--muted);}
  .crumb a:hover{color:var(--accent);}
  .crumb .sep{color:var(--line);}
  .crumb .current{color:var(--ink); font-weight:600;}

  /* ---------- hero ---------- */
  .hero{padding-block:56px 16px;}
  .eyebrow{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--accent);
    margin:0 0 14px;
  }
  .hero h1{
    font-weight:700;
    font-size:clamp(32px, 5.6vw, 56px);
    line-height:1.08;
    letter-spacing:-0.02em;
    margin:0 0 18px;
    text-wrap:balance;
    white-space:pre-line;
  }
  .hero p{
    max-width:56ch;
    color:var(--muted);
    font-size:19px;
    line-height:1.5;
    letter-spacing:-0.005em;
    margin:0;
    white-space:pre-line;
  }

  /* ---------- category grid (home) — Apple Store-style tiles: a fixed
     light tint per category (stays the same in both themes, like a physical
     product card) holding a real photo plus real HTML title/copy/link,
     rather than text baked into the image. ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    padding-block:36px 56px;
  }
  @media (max-width:760px){ .cat-grid{grid-template-columns:repeat(2,1fr); gap:14px;} }
  @media (max-width:460px){ .cat-grid{grid-template-columns:1fr;} }

  .cat-card{
    position:relative;
    display:flex; flex-direction:column;
    border-radius:26px;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    background:var(--tile, var(--surface-2));
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .cat-card:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .cat-card:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .cat-card-media{
    margin:14px 14px 0; border-radius:16px; overflow:hidden;
    aspect-ratio:4/3; background:#fff;
  }
  .cat-card-media img{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.8,.2,1);}
  .cat-card:hover .cat-card-media img{transform:scale(1.045);}
  .cat-card-body{display:flex; flex-direction:column; gap:4px; padding:16px 20px 20px; color:#1D1D1F;}
  .cat-card-body h3{font-size:19px; font-weight:700; letter-spacing:-0.01em; margin:0;}
  .cat-card-body p{font-size:13.5px; color:#6E6E73; margin:0; line-height:1.4;}
  .cat-card-link{
    display:inline-flex; align-items:center; gap:4px;
    margin-top:8px;
    font-size:13.5px; font-weight:600; color:var(--accent);
  }
  .cat-card-link svg{width:13px; height:13px; transition:transform .2s ease;}
  .cat-card:hover .cat-card-link svg{transform:translateX(3px);}

  /* ---------- section head ---------- */
  .section-head{padding-block:20px 8px;}
  .section-head h2{
    font-size:clamp(26px,3.8vw,34px);
    font-weight:700; letter-spacing:-0.015em; margin:0 0 10px;
  }
  .section-head p{color:var(--muted); font-size:28px; line-height:1.3; letter-spacing:-0.01em; font-weight:500; margin:0; max-width:640px;}

  .cat-tag{
    display:inline-block;
    font-size:12px; font-weight:600; letter-spacing:.01em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:4px 10px; border-radius:980px;
  }

  /* ---------- spec table ---------- */
  .spec-table{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:0 24px;
    padding:6px 24px;
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    margin-block:22px;
    max-width:640px;
  }
  .spec-table dt{
    font-size:13px; font-weight:600; color:var(--muted);
    letter-spacing:0; white-space:nowrap;
    padding-block:15px;
    border-bottom:1px solid var(--line);
  }
  .spec-table dd{
    font-size:14.5px; font-weight:600; margin:0; text-align:right;
    padding-block:15px;
    border-bottom:1px solid var(--line);
  }
  .spec-table dt:nth-last-of-type(1), .spec-table dd:nth-last-of-type(1){border-bottom:none;}

  /* ---------- feature row ---------- */
  .feature-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-block:22px 10px;
  }
  @media (max-width:760px){ .feature-row{grid-template-columns:repeat(2,1fr);} }
  .feature-chip{
    display:flex; flex-direction:column; gap:12px;
    padding:20px 18px 22px;
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .feature-chip:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .feature-chip .ic{
    width:36px; height:36px; border-radius:10px;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .feature-chip .ic svg{width:19px; height:19px;}
  .feature-chip b{font-size:14.5px; font-weight:700; letter-spacing:-0.005em;}
  .feature-chip span{font-size:13px; color:var(--muted); line-height:1.55;}

  .note-banner{
    font-size:13.5px; color:var(--muted);
    background:var(--surface-2);
    border-radius:14px;
    padding:14px 18px;
    margin-block:8px 10px;
    max-width:640px;
  }

  /* ---------- heel-pad pairing ---------- */
  .pad-block{
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    padding:22px 24px;
    margin-block:22px;
    max-width:640px;
  }
  .pad-block h4{
    font-size:17px; font-weight:700; letter-spacing:-0.01em; margin:0 0 6px;
  }
  .pad-block > p{font-size:13.5px; color:var(--muted); margin:0 0 16px; line-height:1.6;}
  .pad-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .pad-row:last-child{margin-bottom:0;}
  .swatch-group{display:flex; align-items:center; gap:5px;}
  .swatch-dot{width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,0.12); flex:0 0 auto;}
  .pad-row .to{color:var(--muted); flex:0 0 auto;}
  .pad-row .to svg{width:14px; height:14px; display:block;}
  .swatch-names{font-size:12px; color:var(--muted);}

  /* ---------- product grid (category view) ---------- */
  .group-header{
    font-size:16px; font-weight:700;
    letter-spacing:-0.005em;
    padding-block:24px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .group-header::after{content:''; flex:1; height:1px; background:var(--line);}

  .prod-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
  }
  .prod-grid + .prod-grid{ margin-top:0; }
  section.prod-grid:last-of-type{ margin-bottom:28px; }
  @media (max-width:760px){ .prod-grid{grid-template-columns:repeat(3,1fr); gap:12px;} }
  @media (max-width:460px){ .prod-grid{grid-template-columns:repeat(2,1fr);} }

  .prod-card{
    display:flex; flex-direction:column; gap:10px;
    background:var(--surface);
    border-radius:18px;
    padding:12px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .prod-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .prod-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .prod-thumb{position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:var(--surface-2);}
  .prod-thumb img{width:100%; height:100%; object-fit:cover;}
  .prod-name{font-size:14px; font-weight:600; letter-spacing:-0.005em; text-align:center;}
  .prod-swatch{display:inline-flex; align-items:center; justify-content:center; gap:5px;}

  .thumb-placeholder{
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--muted);
  }
  .thumb-placeholder svg{width:26px; height:26px; opacity:.6;}
  .thumb-placeholder span{font-size:10.5px; font-weight:700; letter-spacing:.02em;}

  .status-tag{
    position:absolute; top:6px; left:6px;
    font-size:10px; font-weight:700; letter-spacing:.02em;
    padding:3px 7px; border-radius:999px;
    background:rgba(23,24,26,0.72); color:#fff;
  }

  /* ---------- product detail ---------- */
  .prod-detail{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap:40px;
    padding-block:26px 56px;
    align-items:start;
  }
  @media (max-width:760px){ .prod-detail{grid-template-columns:1fr;} }

  .prod-detail-media{
    background:var(--surface);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .prod-detail-media img{width:100%; height:auto;}
  .media-placeholder{
    aspect-ratio:4/3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:var(--muted);
  }
  .media-placeholder svg{width:40px; height:40px; opacity:.5;}
  .media-placeholder span{font-size:13px; font-weight:700;}

  .prod-detail-tall{
    display:flex; flex-direction:column; gap:16px;
    padding-block:26px 56px;
    max-width:640px;
  }
  .prod-detail-tall .prod-detail-media{max-width:100%;}

  .prod-detail-info{display:flex; flex-direction:column; gap:16px; padding-top:4px;}
  .prod-detail-info h2, .prod-detail-tall h2{
    font-size:clamp(26px,3.8vw,36px);
    font-weight:700; letter-spacing:-0.02em; margin:0;
  }
  .prod-desc{font-size:15px; line-height:1.65; color:var(--muted); margin:0; max-width:44ch;}

  .btn-accent{
    display:inline-flex; align-items:center; gap:8px;
    align-self:flex-start;
    background:var(--accent); color:var(--accent-ink);
    font-weight:600; font-size:15px;
    padding:13px 22px; border-radius:980px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn-accent:hover{transform:translateY(-2px); opacity:0.92;}
  .btn-accent svg{width:16px; height:16px;}

  .gallery-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .gallery-strip a{
    width:76px; height:76px; border-radius:12px; overflow:hidden;
    background:var(--surface-2); box-shadow:var(--shadow-sm);
  }
  .gallery-strip img{width:100%; height:100%; object-fit:cover;}
  .gallery-label{font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--muted);}

  /* ---------- vehicle list / zoom frame ---------- */
  .frame{
    margin-block:26px 56px;
    background:var(--surface);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    max-width:760px;
  }
  .frame img{width:100%; height:auto;}

  /* ---------- vehicle groups (3D TPE compatible cars) ---------- */
  .vehicle-groups{max-width:760px; margin-block:22px 40px; display:flex; flex-direction:column; gap:4px;}
  .vehicle-brand-block{
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    padding:18px 20px 20px;
  }
  .vehicle-brand-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .vehicle-brand-head b{font-size:16px; font-weight:800; letter-spacing:-0.005em;}
  .vehicle-brand-head .count{font-size:12.5px; color:var(--muted); font-weight:600;}
  .vehicle-chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .vehicle-chip{
    font-size:13.5px; font-weight:600; color:var(--ink);
    background:var(--surface-2);
    border-radius:980px;
    padding:8px 14px;
    line-height:1.3;
  }

  /* ---------- board (notices / blog) ---------- */
  .board-subhead{
    font-size:15px; font-weight:700; letter-spacing:-0.005em;
    margin:0; padding-block:28px 12px;
  }
  .notice-list, .blog-list{display:flex; flex-direction:column; gap:12px; margin-bottom:8px;}
  .notice-card{
    background:var(--surface);
    border-radius:16px;
    box-shadow:var(--shadow-sm);
    padding:18px 22px;
  }
  .notice-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px;}
  .notice-head h3{font-size:15px; font-weight:700; margin:0; letter-spacing:-0.005em;}
  .notice-head time{font-size:12.5px; color:var(--muted); flex:0 0 auto;}
  .notice-card p{font-size:13.5px; line-height:1.7; color:var(--muted); margin:0; white-space:pre-line;}

  .blog-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface);
    border-radius:16px;
    box-shadow:var(--shadow-sm);
    padding:16px 22px;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .blog-card:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .blog-card-title{font-size:14.5px; font-weight:600;}
  .blog-card-link{display:inline-flex; align-items:center; gap:4px; font-size:13.5px; font-weight:600; color:var(--accent); flex:0 0 auto;}
  .blog-card-link svg{width:13px; height:13px;}
  .empty-note{font-size:13.5px; color:var(--muted); margin:0;}

  footer.site{
    border-top:1px solid var(--line);
    padding-block:24px 36px;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.7;
  }
  footer.site p{margin:0;}

  /* ---------- mobile fixed contact bar ---------- */
  .mobile-bar{display:none;}

  @media (max-width:640px){
    .topbar-tag{display:none;}
    footer .footer-cta{flex-direction:column; align-items:flex-start;}
    body{padding-bottom:82px;}
    .mobile-bar{
      display:flex;
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      gap:10px;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background:var(--surface);
      border-top:1px solid var(--line);
      box-shadow:0 -4px 16px rgba(0,0,0,0.08);
    }
    .mobile-bar a{
      flex:1 1 0;
      display:flex; align-items:center; justify-content:center; gap:6px;
      height:46px; padding:0;
      border-radius:980px;
      font-size:14.5px; font-weight:700;
      white-space:nowrap;
    }
    .mobile-bar a svg{width:17px; height:17px; flex:0 0 auto; display:block;}
    .mobile-bar .call-btn{background:var(--accent); color:var(--accent-ink);}
  }

  /* ---------- long-form detail page (stacked slices) ---------- */

  function crumb(items){
    const parts = items.map((it, i) => {

    });
    return `<nav class="crumb">${parts.join('')}</nav>`;
  }

  }

  function featureRow(features){
    if (!features || !features.length) return '';

    `).join('');
    return `<div class="feature-row">${chips}</div>`;
  }

  function padPairing(hp){
    if (!hp) return '';

    return `<div class="pad-block">

  }

  function detailPage(cat){

  function vsToast(t){ const el = document.getElementById('vs-toast'); if (!el) return; el.textContent = t; el.classList.add('on'); clearTimeout(vsToast._t); vsToast._t = setTimeout(() => el.classList.remove('on'), 3200); }
  async function vsCopy(text){
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok;
    }
  }

  function vsBind(cat){
    const root2 = document.getElementById('view-root');
    const relist = () => { const l = document.getElementById('vs-list'); if (l) l.innerHTML = vsList(cat); const t = root2.querySelector('.vs-tabs'); if (t) t.hidden = !!VS.q; };
    const q = document.getElementById('vs-q');
    if (q) q.addEventListener('input', () => { VS.q = q.value.trim(); relist(); });
    root2.onclick = async (e) => {
      const b = e.target.closest('[data-vs-act]'); if (!b) return;
      const act = b.dataset.vsAct;
      if (act === 'scroll') { document.getElementById('vs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      if (act === 'tab') { VS.tab = b.dataset.tab; VS.model = null; root2.querySelectorAll('.vs-tabs button').forEach(x => x.classList.toggle('on', x === b)); relist(); return; }
      if (act === 'brand') { const k = b.dataset.key; const cur = b.closest('.vs-brand').classList.contains('open'); VS.open[k] = !cur; relist(); return; }
      if (act === 'model') { const k = b.dataset.key; VS.model = VS.model === k ? null : k; relist(); return; }
      if (act === 'variant') {
        const kind = b.dataset.kind, brand = b.dataset.brand, model = b.dataset.model, idx = +b.dataset.idx;
        const bl = cat.vehicleData[kind].find(x => x.brand === brand); const g = bl.groups.find(x => x.model === model); const v = g.variants[idx];
        VS.variant = { brand, model, v };
        const fu = brand === '테슬라' ? ['전기(EV)'] : vsFuels(v), se = vsSeats(v);
        VS.form = { comp: { '1열': true, '2열': true }, fuel: fu.length === 1 ? fu[0] : '', seat: se.length === 1 ? se[0] : '', color: vsBrownOk(v) ? '' : '블랙', drive: /2륜/.test(v.name) ? '2륜' : (/4륜/.test(v.name) ? '4륜' : '') };
        vsOpenSheet(); return;
      }
      if (act === 'close') { vsCloseSheet(); return; }
      if (act === 'pick') { VS.form[b.dataset.f] = VS.form[b.dataset.f] === b.dataset.v ? '' : b.dataset.v; vsRenderSheet(); return; }
      if (act === 'comp') { VS.form.comp = VS.form.comp || {}; VS.form.comp[b.dataset.k] = !VS.form.comp[b.dataset.k]; vsRenderSheet(); return; }
      if (act === 'kakao') {
        const miss = vsMissing();
        if (miss.length && !confirm('아직 입력하지 않은 항목이 있습니다: ' + miss.join(', ') + '\n그래도 문의하시겠어요?')) return;
        const ok = await vsCopy(vsMessage());
        vsToast(ok ? '문의 내용이 복사되었습니다. 카카오톡 채팅창에 붙여넣기 해주세요.' : '복사에 실패했습니다. 미리보기 내용을 길게 눌러 복사해 주세요.');
        const url = CATALOG.kakaoChatUrl; if (url) setTimeout(() => window.open(url, '_blank', 'noopener'), ok ? 600 : 1500);
        return;
      }
    };
    root2.oninput = (e) => {
      const i = e.target.closest('[data-vs-in]'); if (!i) return;
      VS.form[i.dataset.vsIn] = i.value; vsRefreshSheetText();
    };
    document.onkeydown = (e) => { if (e.key === 'Escape') vsCloseSheet(); };
  }

  function renderVehicleCategory(cat){
    document.title = `${cat.name} · 오토씨앤씨`;
    VS.model = null;
    root.innerHTML = `
      ${crumb([{label:'전체 카테고리', href:'#/'}, {label:cat.name}])}
      <div class="section-head">
        <h2>${cat.name}</h2>
        <p>${cat.tagline}</p>
      </div>
      ${vsBanner(cat)}
      ${vsSelector(cat)}
      ${specTable(cat.specs)}
      ${featureRow(cat.features)}
      ${cat.detailImage ? `<div class="frame" style="margin-top:22px;"><img src="${cat.detailImage}" alt="${cat.name} 상세 이미지" loading="lazy"></div>` : ''}
    `;
    vsBind(cat);
  }
  /* =================== end 3D TPE vehicle selector =================== */

  function renderCategory(cat){
    if (cat.vehicleData){ renderVehicleCategory(cat); return; }
    document.title = `${cat.name} · 오토씨앤씨`;

    let gridHtml;
    if (cat.groupOrder && cat.groupOrder.length){
      gridHtml = cat.groupOrder.map(g => {
        const items = cat.products.filter(p => p.group === g.id);
        if (!items.length) return '';
        return `<h3 class="group-header">${g.label}</h3>
          <section class="prod-grid">${items.map(p => productCard(cat, p)).join('')}</section>`;
      }).join('');
    } else {
      gridHtml = `<section class="prod-grid">${cat.products.map(p => productCard(cat, p)).join('')}</section>`;
    }

    root.innerHTML = `
      ${crumb([{label:'전체 카테고리', href:'#/'}, {label:cat.name}])}
      <div class="section-head">
        <h2>${cat.name}</h2>
        <p>${cat.tagline}</p>
      </div>
      ${specTable(cat.specs)}
      ${cat.infoImage ? `<div class="frame" style="margin-top:16px;"><img src="${cat.infoImage}" alt="${cat.name} 안내 이미지"></div>` : ''}
      ${featureRow(cat.features)}
      ${cat.note ? `<div class="note-banner">${cat.note}</div>` : ''}
      ${padPairing(cat.heelPad)}
      ${gridHtml}
      ${detailPage(cat)}
    `;
  }

  function prodCrumb(cat, p, tail){
    const items = [{label:'전체 카테고리', href:'#/'}, {label:cat.name, href:'#/cat/'+cat.id}];
    if (p.name !== cat.name) items.push({label:p.name, href:'#/cat/'+cat.id+'/p/'+p.id});
    if (tail) items.push({label:tail});
    return crumb(items);
  }

  function renderProduct(cat, p){
    document.title = `${p.name} · ${cat.name} · 오토씨앤씨`;

    if (p.tall){
      const cta = (p.vehicleGroups && p.vehicleGroups.length) || p.vehicleList
        ? `<a class="btn-accent" href="#/cat/${cat.id}/p/${p.id}/vehicles">주문 가능 차종 확인 ${arrowIcon}</a>`
        : '';
      root.innerHTML = `
        ${prodCrumb(cat, p)}
        <section class="prod-detail-tall">
          <span class="cat-tag" style="align-self:flex-start;">${cat.name}</span>
          <h2>${p.name}</h2>
          ${specTable(p.specs)}
          ${cta}
          <div class="prod-detail-media" style="margin-top:8px;"><img src="${p.detail}" alt="${cat.name} ${p.name} 상세 이미지"></div>
        </section>
      `;
      return;
    }

    let extra = '';
    if (p.gallery && p.gallery.length){
      const thumbs = p.gallery.map((g,i) => `<a href="#/cat/${cat.id}/p/${p.id}/g/${i}"><img src="${g}" alt="${p.name} 추가 이미지 ${i+1}" loading="lazy"></a>`).join('');
      extra += `<div><div class="gallery-label" style="margin-bottom:8px;">추가 이미지</div><div class="gallery-strip">${thumbs}</div></div>`;
    }

    const media = p.detail
      ? `<img src="${p.detail}" alt="${cat.name} ${p.name}">`
      : `<div class="media-placeholder">${ICONS.box}<span>${p.status === 'preparing' ? '상품 준비중입니다' : '이미지 준비중입니다'}</span></div>`;

    root.innerHTML = `
      ${prodCrumb(cat, p)}
      <section class="prod-detail">
        <div class="prod-detail-media">${media}</div>
        <div class="prod-detail-info">
          <span class="cat-tag" style="align-self:flex-start;">${cat.name}</span>
          <h2>${p.name}</h2>
          ${extra}
        </div>
      </section>
    `;
  }

  function renderVehicles(cat, p){
    document.title = `주문 가능 차종 · ${p.name} · 오토씨앤씨`;
    let body;
    if (p.vehicleGroups && p.vehicleGroups.length){
      const groups = p.vehicleGroups.map(g => `
        <div class="vehicle-brand-block">
          <div class="vehicle-brand-head"><b>${g.brand}</b><span class="count">${g.models.length}종</span></div>
          <div class="vehicle-chip-wrap">${g.models.map(m => `<span class="vehicle-chip">${m}</span>`).join('')}</div>
        </div>
      `).join('');
      body = `<div class="vehicle-groups">${groups}</div>`;
    } else {
      body = `<div class="frame"><img src="${p.vehicleList}" alt="3D TPE 카매트 주문 가능 차종 목록"></div>`;
    }
    root.innerHTML = `
      ${prodCrumb(cat, p, '주문 가능 차종')}
      <div class="section-head">
        <h2>주문 가능 차종</h2>
        <p>회사별로 재고를 보유한 차종입니다. 목록에 없는 차종도 문의해 주세요.</p>
      </div>
      ${body}
    `;
  }

  function renderGalleryZoom(cat, p, idx){
    document.title = `${p.name} 이미지 · 오토씨앤씨`;
    const src = p.gallery[idx];
    root.innerHTML = `
      ${prodCrumb(cat, p, '이미지 '+(idx+1))}
      <div class="frame" style="margin-top:22px;"><img src="${src}" alt="${p.name} 추가 이미지"></div>
    `;
  }

  function renderBoard(){
    document.title = '게시판 · 오토씨앤씨';
    const board = CATALOG.board || {};
    const notices = (board.notices || []).map(n => `
      <article class="notice-card">
        <div class="notice-head"><h3>${n.title}</h3><time>${n.date}</time></div>
        <p>${n.body}</p>
      </article>
    `).join('');
    const blogs = (board.blogLinks || []).map(b => `
      <a class="blog-card" href="${b.url}" target="_blank" rel="noopener">
        <span class="blog-card-title">${b.title}</span>
        <span class="blog-card-link">바로가기 ${arrowIcon}</span>
      </a>
    `).join('');
    root.innerHTML = `
      ${crumb([{label:'전체 카테고리', href:'#/'}, {label:'게시판'}])}
      <div class="section-head">
        <h2>게시판</h2>
        <p>공지사항과 오토씨앤씨 블로그 소식을 확인하세요.</p>
      </div>
      <h3 class="board-subhead">공지사항</h3>
      <div class="notice-list">${notices || '<p class="empty-note">등록된 공지사항이 없습니다.</p>'}</div>
      <h3 class="board-subhead">블로그</h3>
      <div class="blog-list">${blogs || '<p class="empty-note">등록된 블로그 글이 없습니다.</p>'}</div>
    `;
  }

  function updateTopnav(){
    const isBoard = location.hash.replace(/^#\/?/, '').split('/')[0] === 'board';
    document.querySelectorAll('.topnav a').forEach(a => {
      const href = a.getAttribute('href');
      a.classList.toggle('active', isBoard ? href === '#/board' : href === '#/');
    });
  }

  function render(){
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    window.scrollTo(0,0);
    updateTopnav();
    if (parts.length === 0){ renderHome(); return; }
    if (parts[0] === 'board'){ renderBoard(); return; }
    if (parts[0] === 'cat' && parts[1]){
      const cat = byId(CATALOG.categories, parts[1]);
      if (!cat){ renderHome(); return; }
      if (cat.vehicleData){ renderVehicleCategory(cat); return; }
      if (parts[2] === 'p' && parts[3]){
        const p = byId(cat.products, parts[3]);
        if (!p){ renderCategory(cat); return; }
        if (parts[4] === 'vehicles' && ((p.vehicleGroups && p.vehicleGroups.length) || p.vehicleList)){ renderVehicles(cat, p); return; }
        if (parts[4] === 'g' && p.gallery && p.gallery[Number(parts[5])] !== undefined){ renderGalleryZoom(cat, p, Number(parts[5])); return; }
        renderProduct(cat, p);
        return;
      }
      renderCategory(cat);
      return;
    }
    renderHome();
  }

  const kakaoUrl = CATALOG.kakaoChatUrl;
  if (kakaoUrl){
    const top = document.getElementById('kakao-btn-top');
    const foot = document.getElementById('kakao-btn-footer');
    const mob = document.getElementById('kakao-btn-mobile');
    if (top) top.href = kakaoUrl;
    if (foot) foot.href = kakaoUrl;
    if (mob) mob.href = kakaoUrl;
  }

  const phone = CATALOG.phone;
  if (phone){
    const telHref = 'tel:' + phone.replace(/[^0-9+]/g, '');
    const mobCall = document.getElementById('mobile-call-btn');
    const footPhone = document.getElementById('footer-phone-link');
    if (mobCall) mobCall.href = telHref;
    if (footPhone){ footPhone.href = telHref; footPhone.textContent = phone; }
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body></html>
