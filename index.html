<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>오토씨앤씨 카매트 컬렉션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif;
    --ink:#1D1D1F;
    --muted:#6E6E73;
    --paper:#FBFBFD;
    --surface:#FFFFFF;
    --surface-2:#F5F5F7;
    --line:#D2D2D7;
    --accent:#0070E0;
    --accent-hover:#0077ED;
    --accent-ink:#FFFFFF;
    --accent-soft:#E8F1FD;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 24px 48px -16px rgba(0,0,0,0.14);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --topbar-bg: rgba(251,251,253,0.75);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F5F5F7;
      --muted:#98989D;
      --paper:#000000;
      --surface:#1C1C1E;
      --surface-2:#161617;
      --line:#38383A;
      --accent:#2A96FF;
      --accent-hover:#5CB1FF;
      --accent-ink:#00142B;
      --accent-soft:rgba(42,150,255,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 24px 48px -16px rgba(0,0,0,0.6);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
      --topbar-bg: rgba(0,0,0,0.72);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F5F5F7;
    --muted:#98989D;
    --paper:#000000;
    --surface:#1C1C1E;
    --surface-2:#161617;
    --line:#38383A;
    --accent:#2A96FF;
    --accent-hover:#5CB1FF;
    --accent-ink:#00142B;
    --accent-soft:rgba(42,150,255,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 24px 48px -16px rgba(0,0,0,0.6);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
    --topbar-bg: rgba(0,0,0,0.72);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    padding-inline:24px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  .shell{max-width:1120px; margin:0 auto;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding-block:16px;
    background:var(--topbar-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
    margin-inline:-24px; padding-inline:24px;
    gap:12px; flex-wrap:wrap;
  }
  .topbar-left{display:flex; align-items:center; gap:22px;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .wordmark{
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  .wordmark span{color:var(--accent);}
  .topnav{display:flex; align-items:center; gap:18px;}
  .topnav a{
    font-size:14px; font-weight:600; color:var(--muted);
    padding-block:4px; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .topnav a:hover{color:var(--ink);}
  .topnav a.active{color:var(--ink); border-bottom-color:var(--accent);}
  .topbar-tag{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--muted);
    background:var(--surface-2);
    padding:6px 12px;
    border-radius:980px;
  }

  /* ---------- kakao channel button ---------- */
  .kakao-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:#FEE500; color:#191919;
    font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:980px;
    transition:filter .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .kakao-btn:hover{filter:brightness(0.95); transform:translateY(-1px);}
  .kakao-btn svg{width:15px; height:15px; flex:0 0 auto; display:block;}
  footer .footer-cta{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    gap:14px;
    padding:20px 24px;
    background:var(--surface-2);
    border-radius:18px;
    margin-bottom:20px;
    color:var(--ink);
    font-size:14px; font-weight:500;
  }

  /* ---------- crumb ---------- */
  .crumb{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    font-size:13px;
    color:var(--muted);
    padding-top:20px;
  }
  .crumb a{color:var(--muted);}
  .crumb a:hover{color:var(--accent);}
  .crumb .sep{color:var(--line);}
  .crumb .current{color:var(--ink); font-weight:600;}

  /* ---------- hero ---------- */
  .hero{padding-block:56px 16px;}
  .eyebrow{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--accent);
    margin:0 0 14px;
  }
  .hero h1{
    font-weight:700;
    font-size:clamp(32px, 5.6vw, 56px);
    line-height:1.08;
    letter-spacing:-0.02em;
    margin:0 0 18px;
    text-wrap:balance;
    white-space:pre-line;
  }
  .hero p{
    max-width:56ch;
    color:var(--muted);
    font-size:19px;
    line-height:1.5;
    letter-spacing:-0.005em;
    margin:0;
    white-space:pre-line;
  }

  /* ---------- category grid (home) — Apple Store-style tiles: a fixed
     light tint per category (stays the same in both themes, like a physical
     product card) holding a real photo plus real HTML title/copy/link,
     rather than text baked into the image. ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    padding-block:36px 56px;
  }
  @media (max-width:760px){ .cat-grid{grid-template-columns:repeat(2,1fr); gap:14px;} }
  @media (max-width:460px){ .cat-grid{grid-template-columns:1fr;} }

  .cat-card{
    position:relative;
    display:flex; flex-direction:column;
    border-radius:26px;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    background:var(--tile, var(--surface-2));
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .cat-card:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .cat-card:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .cat-card-media{
    margin:14px 14px 0; border-radius:16px; overflow:hidden;
    aspect-ratio:4/3; background:#fff;
  }
  .cat-card-media img{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.8,.2,1);}
  .cat-card:hover .cat-card-media img{transform:scale(1.045);}
  .cat-card-body{display:flex; flex-direction:column; gap:4px; padding:16px 20px 20px; color:#1D1D1F;}
  .cat-card-body h3{font-size:19px; font-weight:700; letter-spacing:-0.01em; margin:0;}
  .cat-card-body p{font-size:13.5px; color:#6E6E73; margin:0; line-height:1.4;}
  .cat-card-link{
    display:inline-flex; align-items:center; gap:4px;
    margin-top:8px;
    font-size:13.5px; font-weight:600; color:var(--accent);
  }
  .cat-card-link svg{width:13px; height:13px; transition:transform .2s ease;}
  .cat-card:hover .cat-card-link svg{transform:translateX(3px);}

  /* ---------- section head ---------- */
  .section-head{padding-block:20px 8px;}
  .section-head h2{
    font-size:clamp(26px,3.8vw,34px);
    font-weight:700; letter-spacing:-0.015em; margin:0 0 10px;
  }
  .section-head p{color:var(--muted); font-size:28px; line-height:1.3; letter-spacing:-0.01em; font-weight:500; margin:0; max-width:640px;}

  .cat-tag{
    display:inline-block;
    font-size:12px; font-weight:600; letter-spacing:.01em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:4px 10px; border-radius:980px;
  }

  /* ---------- spec table ---------- */
  .spec-table{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:0 24px;
    padding:6px 24px;
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    margin-block:22px;
    max-width:640px;
  }
  .spec-table dt{
    font-size:13px; font-weight:600; color:var(--muted);
    letter-spacing:0; white-space:nowrap;
    padding-block:15px;
    border-bottom:1px solid var(--line);
  }
  .spec-table dd{
    font-size:14.5px; font-weight:600; margin:0; text-align:right;
    padding-block:15px;
    border-bottom:1px solid var(--line);
  }
  .spec-table dt:nth-last-of-type(1), .spec-table dd:nth-last-of-type(1){border-bottom:none;}

  /* ---------- feature row ---------- */
  .feature-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-block:22px 10px;
  }
  @media (max-width:760px){ .feature-row{grid-template-columns:repeat(2,1fr);} }
  .feature-chip{
    display:flex; flex-direction:column; gap:12px;
    padding:20px 18px 22px;
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .feature-chip:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .feature-chip .ic{
    width:36px; height:36px; border-radius:10px;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .feature-chip .ic svg{width:19px; height:19px;}
  .feature-chip b{font-size:14.5px; font-weight:700; letter-spacing:-0.005em;}
  .feature-chip span{font-size:13px; color:var(--muted); line-height:1.55;}

  .note-banner{
    font-size:13.5px; color:var(--muted);
    background:var(--surface-2);
    border-radius:14px;
    padding:14px 18px;
    margin-block:8px 10px;
    max-width:640px;
  }

  /* ---------- heel-pad pairing ---------- */
  .pad-block{
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    padding:22px 24px;
    margin-block:22px;
    max-width:640px;
  }
  .pad-block h4{
    font-size:17px; font-weight:700; letter-spacing:-0.01em; margin:0 0 6px;
  }
  .pad-block > p{font-size:13.5px; color:var(--muted); margin:0 0 16px; line-height:1.6;}
  .pad-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .pad-row:last-child{margin-bottom:0;}
  .swatch-group{display:flex; align-items:center; gap:5px;}
  .swatch-dot{width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,0.12); flex:0 0 auto;}
  .pad-row .to{color:var(--muted); flex:0 0 auto;}
  .pad-row .to svg{width:14px; height:14px; display:block;}
  .swatch-names{font-size:12px; color:var(--muted);}

  /* ---------- product grid (category view) ---------- */
  .group-header{
    font-size:16px; font-weight:700;
    letter-spacing:-0.005em;
    padding-block:24px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .group-header::after{content:''; flex:1; height:1px; background:var(--line);}

  .prod-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
  }
  .prod-grid + .prod-grid{ margin-top:0; }
  section.prod-grid:last-of-type{ margin-bottom:28px; }
  @media (max-width:760px){ .prod-grid{grid-template-columns:repeat(3,1fr); gap:12px;} }
  @media (max-width:460px){ .prod-grid{grid-template-columns:repeat(2,1fr);} }

  .prod-card{
    display:flex; flex-direction:column; gap:10px;
    background:var(--surface);
    border-radius:18px;
    padding:12px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .prod-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .prod-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .prod-thumb{position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:var(--surface-2);}
  .prod-thumb img{width:100%; height:100%; object-fit:cover;}
  .prod-name{font-size:14px; font-weight:600; letter-spacing:-0.005em; text-align:center;}
  .prod-swatch{display:inline-flex; align-items:center; justify-content:center; gap:5px;}

  .thumb-placeholder{
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--muted);
  }
  .thumb-placeholder svg{width:26px; height:26px; opacity:.6;}
  .thumb-placeholder span{font-size:10.5px; font-weight:700; letter-spacing:.02em;}

  .status-tag{
    position:absolute; top:6px; left:6px;
    font-size:10px; font-weight:700; letter-spacing:.02em;
    padding:3px 7px; border-radius:999px;
    background:rgba(23,24,26,0.72); color:#fff;
  }

  /* ---------- product detail ---------- */
  .prod-detail{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap:40px;
    padding-block:26px 56px;
    align-items:start;
  }
  @media (max-width:760px){ .prod-detail{grid-template-columns:1fr;} }

  .prod-detail-media{
    background:var(--surface);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .prod-detail-media img{width:100%; height:auto;}
  .media-placeholder{
    aspect-ratio:4/3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:var(--muted);
  }
  .media-placeholder svg{width:40px; height:40px; opacity:.5;}
  .media-placeholder span{font-size:13px; font-weight:700;}

  .prod-detail-tall{
    display:flex; flex-direction:column; gap:16px;
    padding-block:26px 56px;
    max-width:640px;
  }
  .prod-detail-tall .prod-detail-media{max-width:100%;}

  .prod-detail-info{display:flex; flex-direction:column; gap:16px; padding-top:4px;}
  .prod-detail-info h2, .prod-detail-tall h2{
    font-size:clamp(26px,3.8vw,36px);
    font-weight:700; letter-spacing:-0.02em; margin:0;
  }
  .prod-desc{font-size:15px; line-height:1.65; color:var(--muted); margin:0; max-width:44ch;}

  .btn-accent{
    display:inline-flex; align-items:center; gap:8px;
    align-self:flex-start;
    background:var(--accent); color:var(--accent-ink);
    font-weight:600; font-size:15px;
    padding:13px 22px; border-radius:980px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn-accent:hover{transform:translateY(-2px); opacity:0.92;}
  .btn-accent svg{width:16px; height:16px;}

  .gallery-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .gallery-strip a{
    width:76px; height:76px; border-radius:12px; overflow:hidden;
    background:var(--surface-2); box-shadow:var(--shadow-sm);
  }
  .gallery-strip img{width:100%; height:100%; object-fit:cover;}
  .gallery-label{font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--muted);}

  /* ---------- vehicle list / zoom frame ---------- */
  .frame{
    margin-block:26px 56px;
    background:var(--surface);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    max-width:760px;
  }
  .frame img{width:100%; height:auto;}

  /* ---------- vehicle groups (3D TPE compatible cars) ---------- */
  .vehicle-groups{max-width:760px; margin-block:22px 40px; display:flex; flex-direction:column; gap:4px;}
  .vehicle-brand-block{
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow-sm);
    padding:18px 20px 20px;
  }
  .vehicle-brand-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .vehicle-brand-head b{font-size:16px; font-weight:800; letter-spacing:-0.005em;}
  .vehicle-brand-head .count{font-size:12.5px; color:var(--muted); font-weight:600;}
  .vehicle-chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .vehicle-chip{
    font-size:13.5px; font-weight:600; color:var(--ink);
    background:var(--surface-2);
    border-radius:980px;
    padding:8px 14px;
    line-height:1.3;
  }

  /* ---------- board (notices / blog) ---------- */
  .board-subhead{
    font-size:15px; font-weight:700; letter-spacing:-0.005em;
    margin:0; padding-block:28px 12px;
  }
  .notice-list, .blog-list{display:flex; flex-direction:column; gap:12px; margin-bottom:8px;}
  .notice-card{
    background:var(--surface);
    border-radius:16px;
    box-shadow:var(--shadow-sm);
    padding:18px 22px;
  }
  .notice-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px;}
  .notice-head h3{font-size:15px; font-weight:700; margin:0; letter-spacing:-0.005em;}
  .notice-head time{font-size:12.5px; color:var(--muted); flex:0 0 auto;}
  .notice-card p{font-size:13.5px; line-height:1.7; color:var(--muted); margin:0; white-space:pre-line;}

  .blog-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface);
    border-radius:16px;
    box-shadow:var(--shadow-sm);
    padding:16px 22px;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .blog-card:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .blog-card-title{font-size:14.5px; font-weight:600;}
  .blog-card-link{display:inline-flex; align-items:center; gap:4px; font-size:13.5px; font-weight:600; color:var(--accent); flex:0 0 auto;}
  .blog-card-link svg{width:13px; height:13px;}
  .empty-note{font-size:13.5px; color:var(--muted); margin:0;}

  footer.site{
    border-top:1px solid var(--line);
    padding-block:24px 36px;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.7;
  }
  footer.site p{margin:0;}

  /* ---------- mobile fixed contact bar ---------- */
  .mobile-bar{display:none;}

  @media (max-width:640px){
    .topbar-tag{display:none;}
    footer .footer-cta{flex-direction:column; align-items:flex-start;}
    body{padding-bottom:82px;}
    .mobile-bar{
      display:flex;
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      gap:10px;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background:var(--surface);
      border-top:1px solid var(--line);
      box-shadow:0 -4px 16px rgba(0,0,0,0.08);
    }
    .mobile-bar a{
      flex:1 1 0;
      display:flex; align-items:center; justify-content:center; gap:6px;
      height:46px; padding:0;
      border-radius:980px;
      font-size:14.5px; font-weight:700;
      white-space:nowrap;
    }
    .mobile-bar a svg{width:17px; height:17px; flex:0 0 auto; display:block;}
    .mobile-bar .call-btn{background:var(--accent); color:var(--accent-ink);}
  }

  /* ---------- long-form detail page (stacked slices) ---------- */
  .detail-page{max-width:860px; margin:8px auto 56px; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); background:#fff;}
  .detail-page img{width:100%; height:auto; display:block;}
  .detail-page-head{max-width:860px; margin:40px auto 14px;}
  .detail-page-head h3{font-size:22px; font-weight:700; letter-spacing:-0.01em; margin:0;}
</style>

<div class="shell">
  <header class="topbar">
    <div class="topbar-left">
      <div class="wordmark">AUTO <span>C&amp;C</span></div>
      <nav class="topnav">
        <a href="#/">카탈로그</a>
        <a href="#/board">게시판</a>
      </nav>
    </div>
    <div class="topbar-right">
      <a class="kakao-btn" id="kakao-btn-top" href="#" target="_blank" rel="noopener">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C6.75 4 2.5 7.24 2.5 11.24c0 2.55 1.72 4.79 4.32 6.07-.19.72-.69 2.58-.79 2.98-.12.5.18.5.38.36.16-.11 2.53-1.72 3.56-2.42.66.1 1.34.15 2.03.15 5.25 0 9.5-3.24 9.5-7.14C21.5 7.24 17.25 4 12 4z"/></svg>카카오톡 채널
      </a>
      <div class="topbar-tag">Dealer Gift Catalog</div>
    </div>
  </header>
  <main id="view-root"></main>

<script>
(function(){
  const CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
  const root = document.getElementById('view-root');
  const byId = (arr, id) => arr.find(x => x.id === id);

  const arrowIcon = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Small reusable line-icon set — shared across categories so the visual
  // language stays consistent rather than a bespoke pictogram per feature.
  const ICONS = {
    check: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5.5c0 5-3.3 8-7 9.5-3.7-1.5-7-4.5-7-9.5V6l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12.2l2.1 2.1L15.5 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="8" y="12" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>',
    palette: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="13" cy="8.5" r="1.3" fill="currentColor"/><circle cx="16" cy="12.5" r="1.3" fill="currentColor"/><circle cx="10.5" cy="15" r="1.3" fill="currentColor"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)" stroke="currentColor" stroke-width="1.6"/><rect x="10" y="10" width="4" height="4" transform="rotate(45 12 12)" stroke="currentColor" stroke-width="1.3" opacity="0.6"/></svg>',
    square: '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>',
    droplet: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5S6 10 6 14.5a6 6 0 0 0 12 0C18 10 12 3.5 12 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 15.5l1.4-4.7A2.5 2.5 0 0 1 7.8 9h8.4a2.5 2.5 0 0 1 2.4 1.8l1.4 4.7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 15.5h16v1.7a1.3 1.3 0 0 1-1.3 1.3H5.3A1.3 1.3 0 0 1 4 17.2v-1.7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="18.3" r="1.1" fill="currentColor"/><circle cx="16" cy="18.3" r="1.1" fill="currentColor"/></svg>',
    feather: '<svg viewBox="0 0 24 24" fill="none"><path d="M19 5c-6 0-13 3-13 11 0 1.5.4 2.5.4 2.5S8 14 12 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 17.5L19 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 8v8l8 4 8-4V8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12v8" stroke="currentColor" stroke-width="1.6"/></svg>',
  };

  function crumb(items){
    const parts = items.map((it, i) => {
      if (i === items.length - 1) return `<span class="current">${it.label}</span>`;
      return `<a href="${it.href}">${it.label}</a><span class="sep">／</span>`;
    });
    return `<nav class="crumb">${parts.join('')}</nav>`;
  }

  function specTable(specs){
    if (!specs || !specs.length) return '';
    const rows = specs.map(s => `<dt>${s.label}</dt><dd>${s.value}</dd>`).join('');
    return `<dl class="spec-table">${rows}</dl>`;
  }

  function featureRow(features){
    if (!features || !features.length) return '';
    const chips = features.map(f => `
      <div class="feature-chip">
        <span class="ic">${ICONS[f.icon] || ICONS.check}</span>
        <b>${f.label}</b>
        <span>${f.desc}</span>
      </div>
    `).join('');
    return `<div class="feature-row">${chips}</div>`;
  }

  function padPairing(hp){
    if (!hp) return '';
    const rows = hp.pairs.map(pair => {
      const mats = pair.mats.map(m => `<span class="swatch-dot" style="background:${m.hex}" title="${m.name}"></span>`).join('');
      const pads = pair.pads.map(m => `<span class="swatch-dot" style="background:${m.hex}" title="${m.name}"></span>`).join('');
      return `<div class="pad-row">
        <span class="swatch-group">${mats}</span>
        <span class="swatch-names">매트</span>
        <span class="to">${arrowIcon}</span>
        <span class="swatch-group">${pads}</span>
        <span class="swatch-names">힐패드</span>
      </div>`;
    }).join('');
    return `<div class="pad-block">
      <h4>${hp.title}</h4>
      <p>${hp.desc}</p>
      ${rows}
    </div>`;
  }

  function detailPage(cat){
    if (!cat.detailPage || !cat.detailPage.length) return '';
    const imgs = cat.detailPage.map((src,i) => `<img src="${src}" alt="${cat.name} 상세페이지 ${i+1}" loading="${i<2?'eager':'lazy'}">`).join('');
    return `<div class="detail-page-head"><h3>${cat.name} 상세페이지</h3></div><section class="detail-page">${imgs}</section>`;
  }

  function thumbInner(p, cat){
    if (p.thumb) return `<img src="${p.thumb}" alt="${cat.name} ${p.name}" loading="lazy">`;
    const label = p.status === 'preparing' ? '상품 준비중' : '이미지 준비중';
    return `<div class="thumb-placeholder">${ICONS.box}<span>${label}</span></div>`;
  }

  function statusBadge(p){
    if (!p.thumb && p.status === 'preparing') return `<span class="status-tag">상품 준비중</span>`;
    if (!p.thumb) return `<span class="status-tag">이미지 준비중</span>`;
    return '';
  }

  function renderHome(){
    document.title = '오토씨앤씨 카매트 컬렉션';
    const cards = CATALOG.categories.map(cat => `
      <a class="cat-card" href="#/cat/${cat.id}" style="--tile:${cat.tileColor || 'var(--surface-2)'}">
        <div class="cat-card-media">${cat.cover ? `<img src="${cat.cover}" alt="${cat.name}" loading="lazy">` : `<div class="thumb-placeholder">${ICONS.box}<span>이미지 준비중</span></div>`}</div>
        <div class="cat-card-body">
          <h3>${cat.name}</h3>
          <p>${cat.tagline}</p>
          <span class="cat-card-link">자세히 보기 ${arrowIcon}</span>
        </div>
      </a>
    `).join('');

    root.innerHTML = `
      <section class="hero">
        <p class="eyebrow">Auto C&amp;C · Car Mat Collection</p>
        <h1>${CATALOG.heroTitle}</h1>
        <p>${CATALOG.heroSub}</p>
      </section>
      <section class="cat-grid">${cards}</section>
    `;
  }

  function productCard(cat, p){
    return `
      <a class="prod-card" href="#/cat/${cat.id}/p/${p.id}">
        <div class="prod-thumb">${thumbInner(p, cat)}${statusBadge(p)}</div>
        <span class="prod-name">${p.hex ? `<span class="prod-swatch"><span class="swatch-dot" style="width:9px;height:9px;background:${p.hex}"></span>${p.name}</span>` : p.name}</span>
      </a>
    `;
  }

  function renderCategory(cat){
    document.title = `${cat.name} · 오토씨앤씨`;

    let gridHtml;
    if (cat.groupOrder && cat.groupOrder.length){
      gridHtml = cat.groupOrder.map(g => {
        const items = cat.products.filter(p => p.group === g.id);
        if (!items.length) return '';
        return `<h3 class="group-header">${g.label}</h3>
          <section class="prod-grid">${items.map(p => productCard(cat, p)).join('')}</section>`;
      }).join('');
    } else {
      gridHtml = `<section class="prod-grid">${cat.products.map(p => productCard(cat, p)).join('')}</section>`;
    }

    root.innerHTML = `
      ${crumb([{label:'전체 카테고리', href:'#/'}, {label:cat.name}])}
      <div class="section-head">
        <h2>${cat.name}</h2>
        <p>${cat.tagline}</p>
      </div>
      ${specTable(cat.specs)}
      ${cat.infoImage ? `<div class="frame" style="margin-top:16px;"><img src="${cat.infoImage}" alt="${cat.name} 안내 이미지"></div>` : ''}
      ${featureRow(cat.features)}
      ${cat.note ? `<div class="note-banner">${cat.note}</div>` : ''}
      ${padPairing(cat.heelPad)}
      ${gridHtml}
      ${detailPage(cat)}
    `;
  }

  function prodCrumb(cat, p, tail){
    const items = [{label:'전체 카테고리', href:'#/'}, {label:cat.name, href:'#/cat/'+cat.id}];
    if (p.name !== cat.name) items.push({label:p.name, href:'#/cat/'+cat.id+'/p/'+p.id});
    if (tail) items.push({label:tail});
    return crumb(items);
  }

  function renderProduct(cat, p){
    document.title = `${p.name} · ${cat.name} · 오토씨앤씨`;

    if (p.tall){
      const cta = (p.vehicleGroups && p.vehicleGroups.length) || p.vehicleList
        ? `<a class="btn-accent" href="#/cat/${cat.id}/p/${p.id}/vehicles">주문 가능 차종 확인 ${arrowIcon}</a>`
        : '';
      root.innerHTML = `
        ${prodCrumb(cat, p)}
        <section class="prod-detail-tall">
          <span class="cat-tag" style="align-self:flex-start;">${cat.name}</span>
          <h2>${p.name}</h2>
          ${specTable(p.specs)}
          ${cta}
          <div class="prod-detail-media" style="margin-top:8px;"><img src="${p.detail}" alt="${cat.name} ${p.name} 상세 이미지"></div>
        </section>
      `;
      return;
    }

    let extra = '';
    if (p.gallery && p.gallery.length){
      const thumbs = p.gallery.map((g,i) => `<a href="#/cat/${cat.id}/p/${p.id}/g/${i}"><img src="${g}" alt="${p.name} 추가 이미지 ${i+1}" loading="lazy"></a>`).join('');
      extra += `<div><div class="gallery-label" style="margin-bottom:8px;">추가 이미지</div><div class="gallery-strip">${thumbs}</div></div>`;
    }

    const media = p.detail
      ? `<img src="${p.detail}" alt="${cat.name} ${p.name}">`
      : `<div class="media-placeholder">${ICONS.box}<span>${p.status === 'preparing' ? '상품 준비중입니다' : '이미지 준비중입니다'}</span></div>`;

    root.innerHTML = `
      ${prodCrumb(cat, p)}
      <section class="prod-detail">
        <div class="prod-detail-media">${media}</div>
        <div class="prod-detail-info">
          <span class="cat-tag" style="align-self:flex-start;">${cat.name}</span>
          <h2>${p.name}</h2>
          ${extra}
        </div>
      </section>
    `;
  }

  function renderVehicles(cat, p){
    document.title = `주문 가능 차종 · ${p.name} · 오토씨앤씨`;
    let body;
    if (p.vehicleGroups && p.vehicleGroups.length){
      const groups = p.vehicleGroups.map(g => `
        <div class="vehicle-brand-block">
          <div class="vehicle-brand-head"><b>${g.brand}</b><span class="count">${g.models.length}종</span></div>
          <div class="vehicle-chip-wrap">${g.models.map(m => `<span class="vehicle-chip">${m}</span>`).join('')}</div>
        </div>
      `).join('');
      body = `<div class="vehicle-groups">${groups}</div>`;
    } else {
      body = `<div class="frame"><img src="${p.vehicleList}" alt="3D TPE 카매트 주문 가능 차종 목록"></div>`;
    }
    root.innerHTML = `
      ${prodCrumb(cat, p, '주문 가능 차종')}
      <div class="section-head">
        <h2>주문 가능 차종</h2>
        <p>회사별로 재고를 보유한 차종입니다. 목록에 없는 차종도 문의해 주세요.</p>
      </div>
      ${body}
    `;
  }

  function renderGalleryZoom(cat, p, idx){
    document.title = `${p.name} 이미지 · 오토씨앤씨`;
    const src = p.gallery[idx];
    root.innerHTML = `
      ${prodCrumb(cat, p, '이미지 '+(idx+1))}
      <div class="frame" style="margin-top:22px;"><img src="${src}" alt="${p.name} 추가 이미지"></div>
    `;
  }

  function renderBoard(){
    document.title = '게시판 · 오토씨앤씨';
    const board = CATALOG.board || {};
    const notices = (board.notices || []).map(n => `
      <article class="notice-card">
        <div class="notice-head"><h3>${n.title}</h3><time>${n.date}</time></div>
        <p>${n.body}</p>
      </article>
    `).join('');
    const blogs = (board.blogLinks || []).map(b => `
      <a class="blog-card" href="${b.url}" target="_blank" rel="noopener">
        <span class="blog-card-title">${b.title}</span>
        <span class="blog-card-link">바로가기 ${arrowIcon}</span>
      </a>
    `).join('');
    root.innerHTML = `
      ${crumb([{label:'전체 카테고리', href:'#/'}, {label:'게시판'}])}
      <div class="section-head">
        <h2>게시판</h2>
        <p>공지사항과 오토씨앤씨 블로그 소식을 확인하세요.</p>
      </div>
      <h3 class="board-subhead">공지사항</h3>
      <div class="notice-list">${notices || '<p class="empty-note">등록된 공지사항이 없습니다.</p>'}</div>
      <h3 class="board-subhead">블로그</h3>
      <div class="blog-list">${blogs || '<p class="empty-note">등록된 블로그 글이 없습니다.</p>'}</div>
    `;
  }

  function updateTopnav(){
    const isBoard = location.hash.replace(/^#\/?/, '').split('/')[0] === 'board';
    document.querySelectorAll('.topnav a').forEach(a => {
      const href = a.getAttribute('href');
      a.classList.toggle('active', isBoard ? href === '#/board' : href === '#/');
    });
  }

  function render(){
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    window.scrollTo(0,0);
    updateTopnav();
    if (parts.length === 0){ renderHome(); return; }
    if (parts[0] === 'board'){ renderBoard(); return; }
    if (parts[0] === 'cat' && parts[1]){
      const cat = byId(CATALOG.categories, parts[1]);
      if (!cat){ renderHome(); return; }
      if (parts[2] === 'p' && parts[3]){
        const p = byId(cat.products, parts[3]);
        if (!p){ renderCategory(cat); return; }
        if (parts[4] === 'vehicles' && ((p.vehicleGroups && p.vehicleGroups.length) || p.vehicleList)){ renderVehicles(cat, p); return; }
        if (parts[4] === 'g' && p.gallery && p.gallery[Number(parts[5])] !== undefined){ renderGalleryZoom(cat, p, Number(parts[5])); return; }
        renderProduct(cat, p);
        return;
      }
      renderCategory(cat);
      return;
    }
    renderHome();
  }

  const kakaoUrl = CATALOG.kakaoChatUrl;
  if (kakaoUrl){
    const top = document.getElementById('kakao-btn-top');
    const foot = document.getElementById('kakao-btn-footer');
    const mob = document.getElementById('kakao-btn-mobile');
    if (top) top.href = kakaoUrl;
    if (foot) foot.href = kakaoUrl;
    if (mob) mob.href = kakaoUrl;
  }

  const phone = CATALOG.phone;
  if (phone){
    const telHref = 'tel:' + phone.replace(/[^0-9+]/g, '');
    const mobCall = document.getElementById('mobile-call-btn');
    const footPhone = document.getElementById('footer-phone-link');
    if (mobCall) mobCall.href = telHref;
    if (footPhone){ footPhone.href = telHref; footPhone.textContent = phone; }
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body></html>
